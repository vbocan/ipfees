name: deploy-app

# Builds the API and Web images and pushes them to GHCR + Docker Hub, then
# rolls both out on the shared Contabo VM (~/ipfees.dataman.ro, see
# docker-compose.yml in the webserver-deploy repo). Single target -- like
# gooblen.ro, unlike caravana-medicala's demo+prod split. Direct port of
# gooblen.ro's deploy-app.yml, adapted for two images instead of one.
#
# Requires repo secrets: CONTABO_HOST, CONTABO_USER, CONTABO_SSH_KEY (in
# addition to the existing DOCKERHUB_TOKEN). If the ghcr.io/vbocan/ipfees
# package is private, `docker login ghcr.io` must already be done on the
# server -- this workflow does not provision that. See docs/DEPLOY.md.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: vbocan
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: src/
        file: src/IPFees.API/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/ipfees:api
          vbocan/ipfees:api
          vbocan/ipfees:api-latest

    - name: Build and push Web image
      uses: docker/build-push-action@v5
      with:
        context: src/
        file: src/IPFees.Web/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/ipfees:web
          vbocan/ipfees:web
          vbocan/ipfees:web-latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            set -e
            cd ~/ipfees.dataman.ro
            docker compose pull
            docker compose up -d
            docker image prune -f