name: tests

# Runs the unit and corpus-equivalence tests on every push and pull request.
# IPFees.Core.Tests uses Testcontainers.MongoDb, which needs a Docker daemon;
# the ubuntu-latest runner provides one. IPFees.Performance.Tests is a
# BenchmarkDotNet project and is deliberately not run here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore src/IPFees.Core.Tests/IPFees.Core.Tests.csproj

    - name: Test
      run: dotnet test src/IPFees.Core.Tests/IPFees.Core.Tests.csproj --no-restore --logger "trx;LogFileName=results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: src/IPFees.Core.Tests/TestResults/results.trx
